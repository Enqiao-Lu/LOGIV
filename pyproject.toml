[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logiv"
version = "0.2.0"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
vision = ["openai>=1.40,<3", "Pillow>=10"]

[tool.setuptools.packages.find]
include = ["logiv*"]
namespaces = false

[tool.setuptools.package-data]
logiv = ["prompts/*.txt", "prompts/*/*.json", "configs/*/*.json", "pddl/*/*/*.pddl"]
